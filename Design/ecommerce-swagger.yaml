    /api/v1/auth/login:
        post:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accessToken:
                                        type: string
            tags:
                - Auth
    /api/v1/auth/register:
        post:
            summary: create user
            description: used to create a user account
            operationId: register_user
            requestBody:
                description: the user to be created
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                                - name
                                - password
                            properties:
                                email:
                                    type: string
                                username:
                                    type: string
                                password:
                                    type: string

            responses:
                "200":
                    description: Create user successful
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    accessToken:
                                        type: string
            security:
                - bearerAuth: []
            tags:
                - Auth
    /api/v1/auth/logout:
        post:
            summary: logout user
            description: used to log a user out
            operationId: logout_user
            responses:
                "200":
                    description: User logged out
                "500":
                    description: Server error
            tags:
                - Auth
    /api/v1/auth/admin:
        post:
            summary: create admin
            description: used to create an admin account
            operationId: create_admin
            requestBody:
                description: the admin to be created
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                            properties:
                                email:
                                    type: string
            responses:
                "200":
                    description: Create admin successful
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: "Admin created"
                "404":
                    description: User not found
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: "User with email not found"

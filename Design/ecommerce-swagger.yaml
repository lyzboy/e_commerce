components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer

    schemas:
        Category:
            type: object
            properties:
                id:
                    type: integer
                    description: Auto-incrementing primary key
                name:
                    type: string
                    description: The name of the category
                description:
                    type: string
                    description: The description for the category
            required:
                - id
                - name
                - description
        User:
            type: object
            properties:
                email:
                    type: string
                    description: The email for the user (PK)
                username:
                    type: string
                    maxLength: 50
                    description: The user's username.
                name:
                    type: string
                    maxLength: 254
                    description: The user's name
                streetName: 
                    type: string
                    maxLength: 75
                    description: The name of the street the user ships to.
                streetNumber:
                    type: string
                city:
                    type: string
                state:
                    type: string
                zipCode:
                    type: string
                phoneNumber:
                    type: string
        Discount:
            type: object
            properties:
                id:
                    type: integer
                    description: The id for the discount (PK)
                code:
                    type: string
                    description: The code (if needed) for the discount.
                percentOff:
                    type: integer
                    description: The percentage amount off as a whole number.
                amountOff: 
                    type: number
                    description: The dollar amount the discount takes off of the product price
                expireDate:
                    type: string
                    description: the date the discount expires
                quantity:
                    type: integer
                    description: The quantity of the discount available.

        Hero:
            type: object
            properties:
                id:
                    type: integer
                    description: The ID of the hero.
                categoryId:
                    type: integer
                    description: The ID of the category associated with the hero.
                productId:
                    type: integer
                    description: The ID of the product associated with the hero.
                layout:
                    type: integer
                    description: The layout type of the hero.
                heading:
                    type: string
                    description: The main heading of the hero.
                subTitle1:
                    type: string
                    description: The first subtitle of the hero.
                subTitle2:
                    type: string
                    description: The second subtitle of the hero.
                backgroundColor:
                    type: string
                    description: The background color of the hero.
                textColor:
                    type: string
                    description: The text color of the hero.
                imageurl:
                    type: string
                    description: The URL of the hero's image.
        Order:
            type: object
            properties:
                id:
                    type: integer
                    description: Auto-incrementing primary key
                userId:
                    type: string
                    description: The user's id
                products:
                    type: array
                    items: 
                        type: string
                    description: The products in the order
                purchaseDate:
                    type: string
                    format: date
                    description: The date the order was purchased
                status:
                    type: string
                    description: The status of the order
                discounts:
                    type: array
                    items:
                        type: string
                    description: The discounts applied to the order
                orderTotal:
                    type: number
                    format: float
                    description: The total cost of the order

                
        Product:
            type: object
            properties:
                id:
                    type: integer
                    description: Auto-incrementing primary key
                barcode:
                    type: string
                    maxLength: 20
                    description: The barcode of the product
                    nullable: true
                name:
                    type: string
                    maxLength: 50
                    description: The name of the product
                description:
                    type: string
                    maxLength: 254
                    description: A detailed description of the product
                    nullable: true
                price:
                    type: number
                    format: float
                    description: The price of the product, must be greater than 0
                quantity:
                    type: integer
                    description: The quantity of the product in stock, must be greater than 0
            required:
                - id
                - name
                - price
                - quantity
